[workspace]
resolver = "3"
members = ["crates/qquic"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/OxiBelt/qquic"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
